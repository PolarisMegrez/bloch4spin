[project]
name = "bloch4spin"
version = "0.1.0"
description = "Generalized Bloch representation utilities for spin-j systems."
readme = "README.md"
authors = [ { name = "Local Dev" } ]
license = { text = "Unlicensed" }
requires-python = ">=3.9"
dependencies = [
	"numpy>=1.24",
	"sympy>=1.10"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bloch4spin"]
