[project]

name = "bloch4spin"
version = "0.2.0"
description = "Generalized Bloch representation utilities for spin-j systems (COBITO basis, Liouvillian, measurement, simulation engine)."
readme = "README.md"
authors = [ { name = "Yu Xue-Hao", email = "yuxuehao23@mails.ucas.ac.cn" } ]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"scipy>=1.11",
	"sympy>=1.10"
]

[project.urls]
Repository = "https://github.com/PolarisMegrez/bloch4spin"
Documentation = "https://github.com/PolarisMegrez/bloch4spin/blob/main/user_guide_en.md"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["bloch4spin"]
